  <g transform="rotate(-45 60 60)">
    <circle cx="60" cy="60" r="28" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="M60 32 A28 28 0 0 0 60 88 Z" fill="#fff"/>
  </g>
</svg>
